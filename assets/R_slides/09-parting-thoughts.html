# Writing Functions

Useful when you find yourself thinking:

+ "I'm repeating the same code over and over"
+ "Only one part keeps changing"
+ "If I make one improvement, I wish it applied everywhere"
--


``` r
plot_histogram &lt;- function(data, var) {
  ggplot(data, aes(x = .data[[var]])) +
    geom_histogram(bins = 30, color = "white") +
    labs(title = paste("Histogram of", var),
         x = var,
         y = "Count") +
    theme_minimal()
}
plot_histogram(penguins, "bill_length_mm")
```

# Writing Functions: Your Turn

How could this be turned into a function?


``` r
(a - min(a, na.rm = TRUE)) / (max(a, na.rm = TRUE) - min(a, na.rm = TRUE))
(b - min(b, na.rm = TRUE)) / (max(b, na.rm = TRUE) - min(b, na.rm = TRUE))
(c - min(c, na.rm = TRUE)) / (max(c, na.rm = TRUE) - min(c, na.rm = TRUE))
(d - min(d, na.rm = TRUE)) / (max(d, na.rm = TRUE) - min(d, na.rm = TRUE))  
```

# Iteration / for loops / `purrr`

.pull-left[
"Do this iteratively, for every element"

+ Already learned some powerful tools that perform the same action on multiple things:

    + `facet_wrap`
    + `group_by` plus `summarize`

+ To do something to multiple columns, use `across()`
]

--

.pull-right[

``` r
df |&gt; summarize(
  n = n(),
  a = median(a),
  b = median(b),
  c = median(c),
  d = median(d),
)

df |&gt; summarize(
  n = n(),
  across(a:d, median),
)
```
]

# For loops 


``` r
squares &lt;- numeric(5)  # create an empty numeric vector of length 5
for (i in 1:5) {
  squares[i] &lt;- i^2
}
squares
```

```
## [1]  1  4  9 16 25
```

--

BUT, R is vectorized, so it's quicker to just do 


``` r
x &lt;- 1:5
squares &lt;- x^2
squares
```

```
## [1]  1  4  9 16 25
```

Use case: reading in a bunch of data files


``` r
grade_files &lt;- paste("./raw data/", 
                     dir(path = "./raw data/", 
                        pattern = "grade",
                        ignore.case = TRUE), sep = "")

grades &lt;- grade_files %&gt;% 
  map_dfr(read_excel, sheet = 2) %&gt;%
  clean_names() %&gt;%
  filter(term == 2237)
```

### Simulations / Random variables &amp; Distributions

Why simulate?

+ helps us understand randomness / sampling variability
+ allows us to tackle questions we can't solve analytically
+ allow us to test methods / estimators (is this unbiased? which one has smaller variance?)
+ allows us to model / forecast potential outcomes, possible futures (e.g. in finance, public health, environmental risk)

---

### Simulations / Random variables &amp; Distributions

+ `rnorm()`, `rpois()`, etc - generate random variables from a distribution
+ `sample()` - take a random sample of observations, with or without replacement
+ `sample_n()` to take random sample of rows in dplyr pipeline 
+ `replicate()` - concise way to repeat simulations


``` r
replicate(1000, mean(rnorm(50)))
```

# Statistical inference in R

+ `t.test()`, `prop.test()`, `chisq.test()`, `anova()`
+ `infer` package - tidyverse friendly 

---

# Modeling in R

+ `lm` for basic linear models
+ `glm` for generalized linear models (e.g. logistic)
+ `summary()` - for coefficients / model output
+ `predict()` - predictions for any fitted model
+ `broom` package for tidying model output
    + `tidy()`, `glance()`, `augment()`
+ `lme4` package for mixed-effects models
+ `survival` package for survival models
+ `tidymodels` package - modeling &amp; machine learning workflows
