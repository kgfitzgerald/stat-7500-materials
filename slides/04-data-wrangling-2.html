# Joining data frames

---

## Joining data frames


``` r
something_join(x, y)

x |&gt; 
  something_join(y)
```

#### Mutating joins (add variables in)

- `left_join()`: keeps all rows in x
- `right_join()`: keeps all rows in y
- `full_join()`: keeps all rows in x or y
- `inner_join()`: only keeps rows from x that have a matching key in y

---

## Joining data frames


``` r
something_join(x, y)

x |&gt; 
  something_join(y)
```

#### Filtering joins (remove rows based on matches, don't bring in new variables)
- `semi_join()`: only keeps rows from x that have a match in y; does not bring in y's columns
- `anti_join()`: only keeps rows from x that do NOT have a match in y; does not bring in y's columns

## Simpson's paradox

- Not considering an important variable when studying a relationship can result in **Simpson's paradox**
- Simpson's paradox illustrates the effect that omission of an explanatory variable can have on the measure of association between another explanatory variable and a response variable
- The inclusion of a third variable in the analysis can change the apparent relationship between the other two variables

## What does group_by() not do?

`group_by()` does not create frequency tables, `count()` does

.pull-left[

``` r
ucbadmit |&gt; 
  group_by(gender)
```

```
## # A tibble: 4,526 × 3
## # Groups:   gender [2]
##    admit    gender dept 
##    &lt;fct&gt;    &lt;fct&gt;  &lt;ord&gt;

##  2 Admitted Male   A    
##  3 Admitted Male   A    
##  4 Admitted Male   A    
##  5 Admitted Male   A    
##  6 Admitted Male   A    
##  7 Admitted Male   A    
##  8 Admitted Male   A    
##  9 Admitted Male   A    
## 10 Admitted Male   A    
## # ℹ 4,516 more rows
```
]
.pull-right[

``` r
ucbadmit |&gt; 
  count(gender)
```

```
## # A tibble: 2 × 2
##   gender     n
##   &lt;fct&gt;  &lt;int&gt;
## 1 Female  1835
## 2 Male    2691
```
]

## Undo grouping with ungroup()

.pull-left[

``` r
ucbadmit |&gt;
  count(gender, admit) |&gt;
  group_by(gender) |&gt;
  mutate(prop_admit = n / sum(n)) |&gt;
  select(gender, prop_admit)
```

```
## # A tibble: 4 × 2
## # Groups:   gender [2]
##   gender prop_admit
##   &lt;fct&gt;       &lt;dbl&gt;
## 1 Female      0.696
## 2 Female      0.304
## 3 Male        0.555
## 4 Male        0.445
```
]
.pull-right[

``` r
ucbadmit |&gt;
  count(gender, admit) |&gt;
  group_by(gender) |&gt;
  mutate(prop_admit = n / sum(n)) |&gt;
  select(gender, prop_admit) |&gt;
  ungroup()
```

```
## # A tibble: 4 × 2
##   gender prop_admit
##   &lt;fct&gt;       &lt;dbl&gt;
## 1 Female      0.696
## 2 Female      0.304
## 3 Male        0.555
## 4 Male        0.445
```
]

## count() is a short-hand

`count()` is a short-hand for `group_by()` and then `summarise()` to count the number of observations in each group

.pull-left[

``` r
ucbadmit |&gt;
  group_by(gender) |&gt;
  summarise(n = n()) 
```

```
## # A tibble: 2 × 2
##   gender     n
##   &lt;fct&gt;  &lt;int&gt;
## 1 Female  1835
## 2 Male    2691
```
]
.pull-right[

``` r
ucbadmit |&gt;
  count(gender)
```

```
## # A tibble: 2 × 2
##   gender     n
##   &lt;fct&gt;  &lt;int&gt;
## 1 Female  1835
## 2 Male    2691
```
]

---

## count can take multiple arguments

.pull-left[

``` r
ucbadmit |&gt;
  group_by(gender, admit) |&gt;
  summarise(n = n()) 
```

```
## # A tibble: 4 × 3
## # Groups:   gender [2]
##   gender admit        n
##   &lt;fct&gt;  &lt;fct&gt;    &lt;int&gt;

## 2 Female Admitted   557
## 3 Male   Rejected  1493
## 4 Male   Admitted  1198
```
]
.pull-right[

``` r
ucbadmit |&gt;
  count(gender, admit)

## `summarise()` after `group_by()`

- `count()` ungroups after itself
- `summarise()` peels off one layer of grouping by default, or you can specify a different behaviour



``` r
ucbadmit |&gt;
  group_by(gender, admit) |&gt;
  summarise(n = n()) 
```

```
## `summarise()` has grouped output by 'gender'. You can override
## using the `.groups` argument.
```

```
## # A tibble: 4 × 3
## # Groups:   gender [2]
##   gender admit        n
##   &lt;fct&gt;  &lt;fct&gt;    &lt;int&gt;
## 1 Female Rejected  1278
## 2 Female Admitted   557
## 3 Male   Rejected  1493
## 4 Male   Admitted  1198
```
